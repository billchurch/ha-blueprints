blueprint:
  name: Aqara Double Rocker Shade + Light Control v1.2
  description: >
    # 🪟 Aqara Double Rocker Shade + Light Control

    **Version: 1.2**

    Control shades, blinds, or any cover entity with one rocker of an Aqara
    WXKG07LM (D1 double rocker wireless remote switch) via Zigbee2MQTT, and
    optionally toggle lights with the other rocker.

    <details>
    <summary><b>Features:</b> - Click here to expand</summary>


      - Choose which rocker drives the cover (left, right, or both together)
      - Optionally assign the other rocker to toggle up to three lights
      - Light control is off by default, so upgrading changes nothing
      - Lights and switches both accepted, for lamps on smart plugs
      - Supports any Home Assistant cover entity
      - Configurable position for the hold action

    </details>

    <details>
    <summary><b>Button Actions:</b> - Click here to expand</summary>


      **On the cover rocker:**
      - Single Press: Open cover
      - Double Press: Close cover
      - Hold: Set to custom position (configurable)

      **On the light rocker (optional):**
      - Single Press: Toggle the single-press light
      - Double Press: Toggle the double-press light
      - Hold: Toggle the hold light

      The WXKG07LM does not emit a release event, so there is no stop action.

      Note that a mistimed double press is reported by Zigbee2MQTT as two
      separate single presses. On the light rocker that toggles the
      single-press light twice rather than firing the double-press light.

      Setting both rockers to the same value is allowed — a press then runs
      the cover action and the light action together.

    </details>

    <details>
    <summary><b>Setup Help:</b> - Click here to expand</summary>


      **Prerequisites:**
      1. Aqara WXKG07LM paired with Zigbee2MQTT
      2. Working MQTT integration in Home Assistant
      3. Cover entity available in Home Assistant

      **Important:** Zigbee2MQTT only discovers an MQTT device trigger *after*
      that action has fired at least once. Before creating the automation,
      press your chosen rocker once, double-press it once, and hold it once —
      otherwise those triggers will not exist yet and the automation will fail
      to save.

      **Device not in the list?** The picker shows every Aqara/Xiaomi device
      that arrived over MQTT. Look for the name you gave the remote in
      Zigbee2MQTT; its model reads "Wireless remote switch D1 (double rocker)"
      rather than "WXKG07LM". If nothing appears at all, the remote is not
      paired with Zigbee2MQTT — this blueprint does not support ZHA or deCONZ.

    </details>
  domain: automation
  author: billchurch
  source_url: https://github.com/billchurch/ha-blueprints
  input:
    button_device:
      name: Aqara Double Rocker Button
      description: >
        Select your Aqara WXKG07LM remote. The list shows every Aqara/Xiaomi
        device from Zigbee2MQTT — in Zigbee2MQTT this device is described as
        "Wireless remote switch D1 (double rocker)".
      selector:
        device:
          # Deliberately filtered by manufacturer only, not by model.
          # Zigbee2MQTT sets the HA device registry `model` to the converter's
          # *description* ("Wireless remote switch D1 (double rocker)") and puts
          # the "WXKG07LM" code in `model_id`. Older Z2M packed both into one
          # string, "<description> (WXKG07LM)". Filtering on `model: WXKG07LM`
          # therefore matched nothing and left the picker empty.
          filter:
            - integration: mqtt
              manufacturer: Aqara
            - integration: mqtt
              manufacturer: Xiaomi
            - integration: mqtt
              manufacturer: LUMI
          multiple: false
    rocker:
      name: Rocker
      description: >
        Which rocker controls the cover. "Both" means pressing the two rockers
        at the same time, leaving each individual rocker free for other uses.
      default: left
      selector:
        select:
          options:
            - label: Left
              value: left
            - label: Right
              value: right
            - label: Both (pressed together)
              value: both
          mode: dropdown
    cover_entity:
      name: Cover
      description: The shade, blind, or cover to control
      selector:
        entity:
          domain: cover
          multiple: false
    long_press_position:
      name: Hold Position
      description: Position to set when holding the rocker (0=closed, 100=fully open)
      default: 100
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    light_rocker:
      name: Light Rocker
      description: >
        Which rocker toggles lights. Leave as "None" for cover-only control.
        Selecting the same rocker as the cover is allowed — a press then does
        both.
      default: none
      selector:
        select:
          options:
            - label: None (light control disabled)
              value: none
            - label: Left
              value: left
            - label: Right
              value: right
            - label: Both (pressed together)
              value: both
          mode: dropdown
    light_single:
      name: Light — Single Press
      description: >
        Toggled by a single press of the light rocker. Accepts lights and
        switches; leave empty to do nothing.
      default: []
      selector:
        entity:
          filter:
            - domain: light
            - domain: switch
          multiple: false
    light_double:
      name: Light — Double Press
      description: >
        Toggled by a double press of the light rocker. Note that a mistimed
        double press is reported as two single presses, which toggles the
        single-press light instead.
      default: []
      selector:
        entity:
          filter:
            - domain: light
            - domain: switch
          multiple: false
    light_hold:
      name: Light — Hold
      description: >
        Toggled by holding the light rocker. Accepts lights and switches;
        leave empty to do nothing.
      default: []
      selector:
        entity:
          filter:
            - domain: light
            - domain: switch
          multiple: false

triggers:
  # Single press
  - trigger: device
    device_id: !input button_device
    domain: mqtt
    type: action
    subtype: single_left
    id: single_left

  - trigger: device
    device_id: !input button_device
    domain: mqtt
    type: action
    subtype: single_right
    id: single_right

  - trigger: device
    device_id: !input button_device
    domain: mqtt
    type: action
    subtype: single_both
    id: single_both

  # Double press
  - trigger: device
    device_id: !input button_device
    domain: mqtt
    type: action
    subtype: double_left
    id: double_left

  - trigger: device
    device_id: !input button_device
    domain: mqtt
    type: action
    subtype: double_right
    id: double_right

  - trigger: device
    device_id: !input button_device
    domain: mqtt
    type: action
    subtype: double_both
    id: double_both

  # Hold
  - trigger: device
    device_id: !input button_device
    domain: mqtt
    type: action
    subtype: hold_left
    id: hold_left

  - trigger: device
    device_id: !input button_device
    domain: mqtt
    type: action
    subtype: hold_right
    id: hold_right

  - trigger: device
    device_id: !input button_device
    domain: mqtt
    type: action
    subtype: hold_both
    id: hold_both

variables:
  rocker: !input rocker
  position: !input long_press_position
  light_rocker: !input light_rocker
  light_single: !input light_single
  light_double: !input light_double
  light_hold: !input light_hold

actions:
  # All nine triggers start the automation. The two choose blocks below are
  # evaluated independently, so if the cover rocker and the light rocker are
  # set to the same value a single press runs both. That is intentional —
  # merging them into one choose would silently drop the light branch, since
  # choose only ever executes its first matching option.

  # Block 1 - cover
  - choose:
      # Single press - Open cover
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'single_' ~ rocker }}"
        sequence:
          - action: cover.open_cover
            target:
              entity_id: !input cover_entity

      # Double press - Close cover
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'double_' ~ rocker }}"
        sequence:
          - action: cover.close_cover
            target:
              entity_id: !input cover_entity

      # Hold - Set to configured position
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'hold_' ~ rocker }}"
        sequence:
          - action: cover.set_cover_position
            data:
              position: "{{ position }}"
            target:
              entity_id: !input cover_entity

  # Block 2 - lights
  # When light_rocker is "none" the concatenations below produce ids such as
  # "single_none", which this device never emits, so nothing matches and light
  # control is off. The count guard covers a configured rocker whose light
  # entity was left empty.
  - choose:
      # Single press - Toggle the single-press light
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.id == 'single_' ~ light_rocker
                 and light_single | count > 0 }}
        sequence:
          - action: homeassistant.toggle
            target:
              entity_id: !input light_single

      # Double press - Toggle the double-press light
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.id == 'double_' ~ light_rocker
                 and light_double | count > 0 }}
        sequence:
          - action: homeassistant.toggle
            target:
              entity_id: !input light_double

      # Hold - Toggle the hold light
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.id == 'hold_' ~ light_rocker
                 and light_hold | count > 0 }}
        sequence:
          - action: homeassistant.toggle
            target:
              entity_id: !input light_hold

# queued, not single: under single a press landing while the previous run is
# still active is dropped with a warning.
mode: queued
max: 10
